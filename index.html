<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 110px}

.btn.g{background:var(--ok)}.btn.r{background:var(--bad)}.btn.l{background:var(--card);color:var(--tx);border:2px solid var(--bd)}
.fb{border-radius:16px;padding:14px;margin-top:14px}.fb.ok{background:var(--okb)}.fb.bad{background:var(--badb)}.fb p{margin:6px 0 0}

.row{display:flex;gap:10px}.row .btn{flex:1}
.big{text-align:center;font-size:56px;margin:30px 0 6px}.c{text-align:center}
.pv{margin:0 0 8px}.pv svg{width:100%;height:auto;display:block}
.tmr{display:flex;align-items:center;gap:8px;margin:4px 0 12px}.tmr span{flex:1;height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.tmr i{display:block;height:100%;width:100%;background:var(--pri);transition:width .1s linear}.tmr b{min-width:24px;text-align:right}

.bub{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px 12px;font-size:14px}
.lvl{display:flex;align-items:center;gap:8px;margin:12px 0 0}.lvl span{flex:1;height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.lvl i{display:block;height:100%;background:var(--ok);border-radius:6px}.lvl small{color:var(--mut)}
.fb p.tnt{font-weight:700;font-style:italic;margin:8px 0 2px}.fbh{display:flex;align-items:center;gap:10px}.lvlup{font-weight:700;color:var(--ok)}
.card .e{width:48px;height:48px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.sp{position:relative;overflow:hidden;width:100%;aspect-ratio:250/351}.sp>img.sx{display:block;height:100%;width:1000%;max-width:none;animation:spr 1.1s steps(10) infinite}
@keyframes spr{to{transform:translateX(-100%)}}
.march{transform-origin:50% 100%;animation:mrc .56s ease-in-out infinite alternate}

.lf{position:relative;display:block;width:100%;transform-origin:50% 90%;animation:lgh .45s ease-in-out infinite alternate}.lf img{display:block;width:100%;height:auto}.lf img+img{position:absolute;left:0;top:0;animation:flp .8s steps(1) infinite}
@keyframes lgh{from{transform:rotate(-6deg) scale(1)}to{transform:rotate(6deg) scale(1.05)}}@keyframes flp{0%{opacity:0}50%{opacity:1}}
@keyframes brt{0%,100%{transform:scale(1)}50%{transform:scale(1.07) rotate(-2deg)}}
.ava img{animation:brt 3s ease-in-out infinite}
.hop{animation:hop .6s ease}.shake{animation:shk .4s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.hop,.shake,.hero .av,.nb.cur,.dance,.shd,.spot,.notes span,.sp>img.sx,.march,.bn,.lf,.lf img,.ava img{animation:none}}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ava{width:52px;height:52px;border-radius:50%;background:#bfe3ff;border:0;overflow:hidden;padding:0;flex:none}.ava img{width:100%;height:100%;object-fit:contain;display:block;padding:3px}
.st2{display:flex;gap:6px;align-items:center;font-size:20px}.st2 b{font-size:18px}

.row{position:relative;display:flex;justify-content:center;min-height:132px;padding-top:10px}
.nd{display:flex;flex-direction:column;align-items:center;position:relative}

.go{position:absolute;top:-26px;background:var(--card);color:var(--c);border:2px solid var(--bd);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:800;letter-spacing:.5px}

.mas{position:absolute;top:0;width:92px}.mas.l{left:0}.mas.r{right:0}.mas img{width:100%;height:auto;display:block}

.nav button{background:none;border:2px solid transparent;border-radius:14px;padding:4px 12px;color:var(--mut);font:inherit;display:flex;flex-direction:column;align-items:center}.nav button span{font-size:24px}.nav button small{font-size:11px;font-weight:600}.nav button.on{border-color:#4aa3e8;background:rgba(74,163,232,.15);color:var(--tx)}
.chp{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 10px}.chp button{min-width:46px;height:42px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:700;box-shadow:0 3px 0 var(--bd)}
.chips{display:flex;gap:12px;overflow-x:auto;padding:14px 6px 8px;margin:0 -6px}.chips button{flex:none;width:54px;height:48px;border-radius:50%;border:0;background:var(--c);opacity:.5;font-size:24px;box-shadow:0 5px 0 rgba(0,0,0,.3)}.chips button.on{opacity:1;outline:3px solid var(--c);outline-offset:3px}
.hm{display:flex;flex-direction:column;min-height:calc(100vh - 150px);min-height:calc(100dvh - 150px)}
.stage{position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:300px;margin-top:6px}
.spot{position:absolute;bottom:10px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(229,151,58,.35),rgba(229,151,58,0) 70%);animation:glow 1.6s ease-in-out infinite alternate}
.dm{position:relative;width:190px;margin-bottom:18px;cursor:pointer}.dm>img{width:100%;height:auto;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dance{transform-origin:50% 95%;animation:dnc 1.2s ease-in-out infinite alternate}
.dance .armL{transform-origin:54px 212px;animation:aL .6s ease-in-out infinite alternate}.dance .armR{transform-origin:146px 210px;animation:aR .6s ease-in-out infinite alternate}
.shd{position:absolute;bottom:6px;width:120px;height:14px;border-radius:50%;background:rgba(0,0,0,.25);animation:shd .275s ease-in-out infinite alternate}
.notes span{position:absolute;bottom:90px;font-size:26px;color:var(--pri);opacity:0;animation:nt 3s ease-in infinite}
.mi{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin-top:auto}.mi button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--tx);font:inherit}.mi span{width:64px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 0 rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.3)}.mi small{font-size:12px;font-weight:600}
@keyframes dnc{0%{transform:rotate(-7deg) translateY(0)}25%{transform:rotate(-3deg) translateY(-16px)}50%{transform:rotate(0) translateY(0)}75%{transform:rotate(3deg) translateY(-16px)}100%{transform:rotate(7deg) translateY(0)}}
@keyframes aL{from{transform:rotate(18deg)}to{transform:rotate(-28deg)}}@keyframes aR{from{transform:rotate(28deg)}to{transform:rotate(-18deg)}}
@keyframes shd{from{transform:scaleX(1)}to{transform:scaleX(.75)}}@keyframes glow{from{opacity:.55}to{opacity:1}}
@keyframes nt{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-120px) rotate(14deg)}}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#d9822b"><meta name="apple-mobile-web-app-title" content="Banjito"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head><body><div id="app"></div><nav id="nav" class="nav" style="display:none"></nav>
<script>
const $=s=>document.querySelector(s),app=$("#app");
let S={xp:0,streak:0,last:"",best:{},mode:"quiz"};
try{Object.assign(S,JSON.parse(localStorage.getItem("cq")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("cq",JSON.stringify(S))}catch(e){}};
if(!S.v2){const mp=k=>k==0?2:k+2,b={};Object.keys(S.best).forEach(k=>{b[mp(+k)]=S.best[k]});S.best=b;(S.hist||[]).forEach(x=>{x.m=mp(x.m)});S.v2=1;save()}
if(!S.v3){[3,4,6,7].forEach(i=>delete S.best[i]);S.hist=(S.hist||[]).filter(x=>![3,4,6,7].includes(x.m));S.v3=1;save()}
const rnd=a=>a[Math.random()*a.length|0];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(q,c,w,exp){w=shuf([...new Set(w)].filter(x=>x!==c)).slice(0,3);return{q,c,o:shuf([c,...w]),exp}}

/* ===== Teoria ===== */
const L="CDEFGAB",PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11},MAJ=[0,2,4,5,7,9,11];
const acc=n=>n>0?"♯".repeat(n):"♭".repeat(-n);
const par=r=>({l:r[0],p:(PC[r[0]]+(/[#♯]/.test(r[1]||"")?1:/[b♭]/.test(r[1]||"")?-1:0)+12)%12});
function sp(r,d,s){const x=par(r),li=(L.indexOf(x.l)+d-1)%7;let k=(((x.p+s)%12)-PC[L[li]]+12)%12;if(k>6)k-=12;return L[li]+acc(k)}
const dn=n=>n.replace("#","♯").replace(/^(.)b/,"$1♭");
const scale=k=>MAJ.map((s,i)=>sp(k,i+1,s));
const KEYS=["C","G","D","A","E","F","Bb","Eb","Ab"];
const MJ=["C","D","E","F","G","A","B","Bb","Eb","Ab"],MN=["C","D","E","F","G","A","B","Bb","F#"],HD=["C","D","E","G","A","B","F#"];
const CT=[
{s:"",d:[1,3,5],m:[0,4,7],r:MJ,f:"1 – 3 – 5"},
{s:"m",d:[1,3,5],m:[0,3,7],r:MN,f:"1 – ♭3 – 5"},
{s:"7",d:[1,3,5,7],m:[0,4,7,10],r:MJ,f:"1 – 3 – 5 – ♭7"},
{s:"7M",d:[1,3,5,7],m:[0,4,7,11],r:MJ,f:"1 – 3 – 5 – 7"},
{s:"m7",d:[1,3,5,7],m:[0,3,7,10],r:MN,f:"1 – ♭3 – 5 – ♭7"},
{s:"m7♭5",d:[1,3,5,7],m:[0,3,6,10],r:HD,f:"1 – ♭3 – ♭5 – ♭7"}];
const notes=(r,t)=>t.d.map((d,i)=>sp(r,d,t.m[i]));
const nm=(r,t)=>dn(r)+t.s;
const FQ=[["","m","m","","","m","m7♭5"],["7M","m7","m7","7M","7","m7","m7♭5"]];
const RM=[["I","ii","iii","IV","V","vi","viiø"],["I7M","IIm7","IIIm7","IV7M","V7","VIm7","VIIm7♭5"]];
const field=(k,t)=>scale(k).map((n,i)=>n+FQ[t][i]);

/* ===== Geradores de perguntas ===== */
function gNote(){const k=rnd(KEYS),n=1+(Math.random()*7|0),sc=scale(k);
return mk(`Qual a nota do ${n}º grau do campo harmônico de ${dn(k)} maior?`,sc[n-1],sc.filter((_,i)=>i!=n-1),`Escala de ${dn(k)} maior: ${sc.join(" – ")}. O ${n}º grau é ${sc[n-1]}.`)}
function gChord(){const k=rnd(KEYS),t=Math.random()<.5?0:1,i=Math.random()*7|0,f=field(k,t),sc=scale(k);
return mk(`Qual o acorde do ${i+1}º grau de ${dn(k)} maior${t?" (tétrades)":" (tríades)"}?`,f[i],[...f.filter((_,j)=>j!=i),sc[i]+FQ[t][(i+3)%7]],`Campo harmônico de ${dn(k)}: ${f.join(" · ")}.`)}
function gRoman(){const k=rnd(KEYS),t=Math.random()<.5?0:1,i=Math.random()*7|0,f=field(k,t);
return mk(`Em ${dn(k)} maior, qual o grau do acorde ${f[i]}?`,(i+1)+"º",RM[t].map((_,j)=>(j+1)+"º").filter((_,j)=>j!=i),`${f[i]} é o ${i+1}º grau (${RM[t][i]}) de ${dn(k)}. Campo: ${f.join(" · ")}.`)}
function gNotes(pool){const t=rnd(pool||CT),r=rnd(t.r),c=notes(r,t),w=[];
for(let i=1;i<c.length;i++){const x=c.slice(),n=x[i];x[i]=/[♯♭]/.test(n)?n[0]:n+("ABDEG".includes(n[0])?"♭":"♯");w.push(x.join(" – "))}
const o=rnd(CT.filter(u=>u!==t&&u.r.includes(r)));if(o)w.push(notes(r,o).join(" – "));
return mk(`Quais notas formam o acorde ${nm(r,t)}?`,c.join(" – "),w,`Fórmula ${t.f} a partir de ${dn(r)}: ${c.join(" – ")}.`)}
function gDom(){const r=rnd(MJ),c=sp(r,5,7)+"7";
return mk(`Qual a dominante (V7) de ${dn(r)}?`,c,[sp(r,4,5),sp(r,2,2),sp(r,7,11),sp(r,6,9)].map(x=>x+"7"),`A dominante está uma quinta justa acima (7 semitons): ${dn(r)} → ${c}, que resolve em ${dn(r)}.`)}
function gSec(){const k=rnd(KEYS),i=1+(Math.random()*5|0),f=field(k,0),sc=scale(k),r=sc[i],c=sp(r,5,7)+"7";
return mk(`Em ${dn(k)} maior, qual a dominante secundária do acorde ${f[i]}?`,c,[sp(r,4,5),sp(r,2,2),sp(r,7,11),r].map(x=>x+"7"),`${f[i]} é o ${RM[0][i]} grau. Sua dominante (V7/${RM[0][i]}) é ${c}.`)}
function gDom3(){const x=rnd(MJ),r=sp(x,4,5);
return mk(`${dn(x)}7 é dominante de qual nota?`,r,[sp(x,5,7),sp(x,2,2),sp(x,3,4),sp(x,6,9),sp(x,7,11)],`${dn(x)} está uma quinta acima de ${r}, então ${dn(x)}7 é o V7 de ${r}.`)}
const OP=[2,7,11,2],CH=["C","C♯/D♭","D","D♯/E♭","E","F","F♯/G♭","G","G♯/A♭","A","A♯/B♭","B"];
function neck(o){const mx=o.mx||12,W=300/mx,X=f=>f?40+(f-.5)*W:26,Y=i=>34+i*30;
let h=`<svg viewBox="0 0 344 150" role="img" aria-label="Braço do cavaquinho"><rect x="40" y="22" width="300" height="112" rx="3" fill="#4a3424"/>`;
for(let f=1;f<=mx;f++)h+=`<line x1="${40+f*W}" y1="22" x2="${40+f*W}" y2="134" stroke="#bbb"/><text x="${X(f)}" y="14" text-anchor="middle" font-size="10" fill="var(--mut)">${f}</text>`;
[5,7,10,12].filter(f=>f<=mx).forEach(f=>h+=`<circle cx="${X(f)}" cy="144" r="3" fill="var(--mut)"/>`);
h+=`<line x1="40" y1="22" x2="40" y2="134" stroke="#eee" stroke-width="4"/>`;
for(let i=0;i<4;i++){const y=Y(i);
if(i==o.s)h+=`<rect x="40" y="${y-14}" width="300" height="28" fill="var(--pri)" opacity=".25"/>`;
h+=`<g opacity="${i<(o.a||0)?.3:1}"><line x1="40" y1="${y}" x2="340" y2="${y}" stroke="#e8e0d0" stroke-width="${2.4-i*.4}"/><text x="8" y="${y+4}" text-anchor="middle" font-size="10" fill="var(--mut)">${4-i}ª</text><circle cx="26" cy="${y}" r="9" fill="var(--card)" stroke="var(--mut)"/><text x="26" y="${y+4}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--tx)">${o.open?CH[OP[i]]:""}</text></g>`}
if(o.f!=null){const y=Y(o.s),l=o.l;h+=`<circle cx="${X(o.f)}" cy="${y}" r="12" fill="var(--pri)" stroke="#fff"/><text x="${X(o.f)}" y="${y+4}" text-anchor="middle" font-size="${l.length>2?7.5:12}" font-weight="700" fill="#fff">${l}</text>`}
for(let i=0;i<4;i++)for(let f=0;f<=mx;f++){const x=f?40+(f-1)*W:17,w=f?W:18;h+=`<rect x="${x}" y="${Y(i)-15}" width="${w}" height="30" fill="transparent" onclick="hear(${OPM[i]+f})"/>`}
return h+"</svg>"}
